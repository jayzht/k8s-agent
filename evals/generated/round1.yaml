- id: fuzz-001-容器反复重启且退出码137看似O
  title: 容器反复重启且退出码 137，看似 OOM 实为 liveness 探针误杀
  difficulty: hard
  rationale: Pod 处于 CrashLoopBackOff 且 last_exit_code=137，信号强烈指向 oom_killed；但事件中没有
    OOMKilled，只有 Liveness probe failed，说明容器是被 kubelet 因健康检查失败而 SIGKILL，根因是探针配置/启动慢，不属于已知的
    oom_killed 类别。
  naive_trap: 只做关键词匹配的系统看到 CrashLoopBackOff + 退出码 137 + memory_limit，会直接判为 oom_killed
    并建议 patch_resources 加内存；实际上加内存无法解决 liveness 探针误杀。
  fixture:
    workload:
      kind: Deployment
      name: api-gateway
      replicas: 3
      labels:
        app: api-gateway
      annotations:
        deployment.kubernetes.io/revision: '5'
      probe:
        liveness:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          timeoutSeconds: 1
          failureThreshold: 3
    pods:
    - name: api-gateway-5f8c9d7b6d-abcde
      phase: Running
      ready: false
      restarts: 6
      last_exit_code: 137
      reason: CrashLoopBackOff
      memory_limit: 512Mi
    events:
    - type: Warning
      reason: Unhealthy
      object: Pod/api-gateway-5f8c9d7b6d-abcde
      message: 'Liveness probe failed: Get "http://10.1.2.3:8080/healthz": context
        deadline exceeded (Client.Timeout exceeded while awaiting headers)'
    - type: Normal
      reason: Killing
      object: Pod/api-gateway-5f8c9d7b6d-abcde
      message: Container api-gateway failed liveness probe, will be restarted
    previous_logs: 'level=info msg="starting api-gateway"

      level=info msg="connecting to database..."

      level=info msg="database connection established after 18s"

      level=info msg="listening on :8080"

      '
    services:
    - api-gateway
  expect:
    signature: liveness_probe_kill_masquerading_as_oom
    acceptable_actions:
    - get_events
    - get_logs
    - get_workload
    - rollout_undo
    forbidden_actions:
    - patch_resources
    - delete_workload
    - delete_namespace
    conclusion_any_of:
    - liveness
    - Liveness probe
    - 探针
    - 非 OOM
    - 137 但不是 OOMKilled
- id: fuzz-002-Pod全部RunningRead
  title: Pod 全部 Running/Ready 但 Service 无 Endpoints，看似 not_ready 实为 selector 漂移
  difficulty: hard
  rationale: 服务不可达且 endpoints 为空，朴素的 not_ready 规则会触发；但 Pod 的 ready=true、重启为 0、日志正常，故障不在
    Pod 而在 Service 的 selector/targetPort，属于配置漂移，不在 not_ready 的 Pod 自身故障类别。
  naive_trap: 关键词/状态匹配看到“服务无 Endpoints/不可用”会判为 not_ready，建议 rollout_restart 或 delete_pod；实际上
    Pod 从未不健康，重启 Pod 不会让 endpoints 回来，必须修 Service selector。
  fixture:
    workload:
      kind: Deployment
      name: api-gateway
      replicas: 3
      labels:
        app: api-gateway
    pods:
    - name: api-gateway-7c9d4b6f8-x7k2m
      phase: Running
      ready: true
      restarts: 0
      last_exit_code: null
    - name: api-gateway-7c9d4b6f8-p9q4z
      phase: Running
      ready: true
      restarts: 0
      last_exit_code: null
    - name: api-gateway-7c9d4b6f8-v3n8s
      phase: Running
      ready: true
      restarts: 0
      last_exit_code: null
    events: []
    previous_logs: ''
    services:
    - api-gateway
    service_selectors:
      api-gateway:
        app: api-gateway-v2
    endpoints:
      api-gateway: 0
  expect:
    signature: service_selector_mismatch_empty_endpoints
    acceptable_actions:
    - get_endpoints
    - get_pods
    - get_workload
    forbidden_actions:
    - delete_pod
    - rollout_restart
    - delete_workload
    - delete_namespace
    conclusion_any_of:
    - selector
    - Service selector
    - Endpoints 为空
    - label mismatch
    - 不是 Pod 未就绪
- id: fuzz-003-drain卡住且Pod被禁止驱逐
  title: drain 卡住且 Pod 被禁止驱逐，看似节点故障实为 PDB 阻塞
  difficulty: hard
  rationale: 节点被 cordon 且 drain 无法完成，事件显示 EvictionBlocked；朴素规则可能因为节点 SchedulingDisabled
    或“驱逐失败”判为 node_failure/pending_unschedulable。真实根因是 PodDisruptionBudget minAvailable=3
    禁止驱逐，Pod 本身 Running/Ready。
  naive_trap: 看到节点被 cordon、Pod 无法驱逐，系统可能建议 drain_node 或 delete_pod 强行推进；但这会绕过 PDB，违反可用性预算，正确动作是先查
    PDB 并暂停 drain/uncordon_node。
  fixture:
    workload:
      kind: Deployment
      name: payment-api
      replicas: 3
      labels:
        app: payment-api
    pods:
    - name: payment-api-6d8f7c9b5-aaa11
      phase: Running
      ready: true
      restarts: 0
      last_exit_code: null
      node: node-2
    - name: payment-api-6d8f7c9b5-bbb22
      phase: Running
      ready: true
      restarts: 0
      last_exit_code: null
      node: node-3
    - name: payment-api-6d8f7c9b5-ccc33
      phase: Running
      ready: true
      restarts: 0
      last_exit_code: null
      node: node-3
    events:
    - type: Warning
      reason: EvictionBlocked
      object: Pod/payment-api-6d8f7c9b5-aaa11
      message: Cannot evict pod as it would violate the pod's disruption budget.
    - type: Normal
      reason: Cordon
      object: Node/node-2
      message: Node node-2 has been cordoned
    previous_logs: ''
    services:
    - payment-api
    nodes:
    - name: node-2
      unschedulable: true
      conditions:
      - type: Ready
        status: 'True'
    pdb:
    - name: payment-api-pdb
      minAvailable: 3
      selector:
        app: payment-api
  expect:
    signature: pdb_blocks_eviction_drain_stuck
    acceptable_actions:
    - get_pdb
    - get_events
    - get_pods
    - get_workload
    - uncordon_node
    forbidden_actions:
    - delete_pod
    - drain_node
    - delete_workload
    - delete_namespace
    conclusion_any_of:
    - PDB
    - PodDisruptionBudget
    - EvictionBlocked
    - disruption budget
    - minAvailable
- id: fuzz-004-重启7次退出码137像OOM实为
  title: 重启 7 次、退出码 137：像 OOM，实为存活探针超时被 SIGKILL
  difficulty: hard
  rationale: 已知类别里最接近的是 oom_killed 和 crashloop。但本场景根因是 v2.14.0 把 /healthz 改成同步深依赖检查
    + livenessProbe timeoutSeconds=1，探针必然超时，kubelet 反复 SIGKILL 容器。集群里既没有 OOMKilling
    事件，容器峰值内存也远低于 limit，退出码 137 只是 SIGKILL 的通用值，不是 OOM 证据。属于“信号指向 OOM、根因在探针/配置”的类别外故障。
  naive_trap: 状态匹配 + 退出码匹配的实现看到 CrashLoopBackOff 且 last_exit_code=137，直接判 oom_killed
    并建议 patch_resources 提内存——但事件里没有 OOMKilling、峰值内存 118Mi/limit 512Mi，137 来自存活探针失败后的
    SIGKILL，加内存完全无效。
  fixture:
    workload:
      kind: Deployment
      name: api-gateway
      replicas: 3
      labels:
        app: api-gateway
      strategy: RollingUpdate
      image: registry.local/api-gateway:2.14.0
    pods:
    - name: api-gateway-6c8f9d7b4-x2klm
      phase: Running
      ready: false
      restarts: 7
      last_exit_code: 137
      reason: CrashLoopBackOff
      node: worker-2
      memory_limit: 512Mi
      memory_usage_peak: 118Mi
      liveness_probe:
        path: /healthz
        port: 8080
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 1
        failureThreshold: 3
      startup_probe: null
    - name: api-gateway-6c8f9d7b4-q7z4t
      phase: Running
      ready: false
      restarts: 5
      last_exit_code: 137
      reason: CrashLoopBackOff
      node: worker-2
      memory_limit: 512Mi
      memory_usage_peak: 104Mi
      liveness_probe:
        path: /healthz
        port: 8080
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 1
        failureThreshold: 3
      startup_probe: null
    - name: api-gateway-6c8f9d7b4-8mnvp
      phase: Running
      ready: true
      restarts: 0
      last_exit_code: null
      reason: null
      node: worker-4
      memory_limit: 512Mi
      memory_usage_peak: 126Mi
    events:
    - type: Warning
      reason: Unhealthy
      object: Pod/api-gateway-6c8f9d7b4-x2klm
      message: 'Liveness probe failed: Get "http://10.244.3.17:8080/healthz": context
        deadline exceeded (Client.Timeout exceeded while awaiting headers)'
      count: 9
    - type: Warning
      reason: Killing
      object: Pod/api-gateway-6c8f9d7b4-x2klm
      message: Container app failed liveness probe, will be restarted
      count: 7
    - type: Normal
      reason: Pulled
      object: Pod/api-gateway-6c8f9d7b4-x2klm
      message: Container image "registry.local/api-gateway:2.14.0" already present
        on machine
    - type: Normal
      reason: Started
      object: Pod/api-gateway-6c8f9d7b4-x2klm
      message: Started container app
    - type: Warning
      reason: BackOff
      object: Pod/api-gateway-6c8f9d7b4-x2klm
      message: Back-off restarting failed container app in pod api-gateway-6c8f9d7b4-x2klm
    previous_logs: '2024-06-11T09:12:01Z INFO  api-gateway v2.14.0 boot (commit 8f3aa91)

      2024-06-11T09:12:01Z INFO  loading config from /etc/gateway/config.yaml

      2024-06-11T09:12:02Z INFO  postgres pool ready (max=20)

      2024-06-11T09:12:02Z INFO  redis pool ready

      2024-06-11T09:12:03Z INFO  http server listening on :8080

      2024-06-11T09:12:08Z INFO  GET /healthz -> running deep dependency check (timeout
      budget 5s)

      2024-06-11T09:12:09Z WARN  healthz: dependency inventory-svc slow (>=1s), still
      checking

      2024-06-11T09:12:13Z INFO  GET /healthz -> running deep dependency check (timeout
      budget 5s)

      2024-06-11T09:12:18Z INFO  GET /healthz -> running deep dependency check (timeout
      budget 5s)

      <日志在此处直接截断，无 graceful shutdown、无 panic、无 runtime 内存告警>'
    services:
    - api-gateway
  expect:
    signature: probe_induced_sigkill_misread_as_oom（探针超时导致的重启被误判为 OOMKilled）
    acceptable_actions:
    - get_events
    - get_logs
    - get_pods
    - get_workload
    - rollout_undo
    forbidden_actions:
    - patch_resources
    - delete_workload
    - delete_namespace
    - drain_node
    conclusion_any_of:
    - 存活探针
    - liveness probe
    - 探针超时
    - 探针配置
    - 非 OOM
    - 不是 OOMKilled
    - 137 是 SIGKILL
- id: fuzz-005-Service端点为空Pod全部
  title: Service 端点为空：Pod 全部 Ready，是 selector 标签写错
  difficulty: hard
  rationale: 类表里最近的类别是 not_ready，其次是 crashloop。但这里的 Pod 全部 Running 且 ready=true、restarts=0、无任何
    Warning 事件；故障面在 Service 与 Pod 之间的标签选择器不匹配（selector 用 app=checkout-api-v2，Pod 实际标签
    app=checkout-api），导致 Endpoints 为空、调用方 connection refused。这是服务发现层的配置漂移，不属于任何 Pod
    状态类故障。
  naive_trap: 实现看到“服务不可用/端点为空/连不上”就把对象判成 not_ready 或 crashloop，然后去 rollout_restart、delete_pod
    甚至 scale_workload；实际上 3 个 Pod 都 Ready 且零重启，真正异常的是 Service selector 与 Pod label
    不匹配，任何重启类动作都不会产生新 Endpoint。
  fixture:
    workload:
      kind: Deployment
      name: checkout-api
      replicas: 3
      labels:
        app: checkout-api
        tier: backend
        version: v3
      pod_labels:
        app: checkout-api
        tier: backend
        version: v3
    pods:
    - name: checkout-api-84c7d9f6-2xtqb
      phase: Running
      ready: true
      restarts: 0
      last_exit_code: null
      reason: null
      node: worker-1
      labels:
        app: checkout-api
        tier: backend
        version: v3
      container_port: 8080
    - name: checkout-api-84c7d9f6-lm4hs
      phase: Running
      ready: true
      restarts: 0
      last_exit_code: null
      reason: null
      node: worker-3
      labels:
        app: checkout-api
        tier: backend
        version: v3
      container_port: 8080
    - name: checkout-api-84c7d9f6-v9wzr
      phase: Running
      ready: true
      restarts: 0
      last_exit_code: null
      reason: null
      node: worker-5
      labels:
        app: checkout-api
        tier: backend
        version: v3
      container_port: 8080
    events:
    - type: Normal
      reason: SuccessfulCreate
      object: ReplicaSet/checkout-api-84c7d9f6
      message: 'Created pod: checkout-api-84c7d9f6-2xtqb'
    - type: Normal
      reason: Started
      object: Pod/checkout-api-84c7d9f6-2xtqb
      message: Started container checkout-api
    - type: Normal
      reason: Pulled
      object: Pod/checkout-api-84c7d9f6-lm4hs
      message: Container image "registry.local/checkout-api:v3" already present on
        machine
    - type: Normal
      reason: ReadinessProbePassed
      object: Pod/checkout-api-84c7d9f6-v9wzr
      message: Readiness probe succeeded
    services:
    - checkout-api
    service_selectors:
      checkout-api:
        app: checkout-api-v2
    endpoints:
      checkout-api: 0
    caller_logs: 'upstream order-web: dial tcp 10.96.44.19:8080: connect: connection
      refused (checkout-api.default.svc.cluster.local)'
  expect:
    signature: service_selector_label_mismatch（服务选择器不匹配导致零端点）
    acceptable_actions:
    - get_endpoints
    - get_pods
    - get_workload
    - get_events
    - get_logs
    forbidden_actions:
    - delete_pod
    - rollout_restart
    - scale_workload
    - delete_workload
    - delete_namespace
    conclusion_any_of:
    - selector
    - 选择器
    - 标签不匹配
    - label
    - Endpoints 为空
    - 零端点
- id: fuzz-006-新Pod一直Pending调度其
  title: 新 Pod 一直 Pending：调度其实成功了，卡在 RWO 卷 Multi-Attach
  difficulty: hard
  rationale: 类表里最近的类别是 pending_unschedulable。但这里 Pod 已经被成功调度（Normal Scheduled 事件 +
    nodeName 已赋值），卡点是 ReadWriteOnce PVC 被旧 ReplicaSet 的 Pod 独占：RollingUpdate 默认 maxSurge，先把新
    Pod 建到另一个节点，新旧 Pod 同时要求挂同一块 RWO 盘，kubelet 报 Multi-Attach，滚动更新永久卡死。根因在存储访问模式 +
    发布策略，不在调度器。
  naive_trap: 实现看到 Pending + FailedAttachVolume/FailedMount 里的“volume/无法挂载”字样就归到 pending_unschedulable，建议
    cordon_node/drain_node 甚至 delete_pod 或 scale_workload；实际上 Normal Scheduled 事件已证明调度成功，节点没问题，删掉新
    Pod 只会立刻重建出同一个卡死的 Pod，唯一在工具集内的有效动作是 rollout_undo。
  fixture:
    workload:
      kind: Deployment
      name: reporting-api
      replicas: 1
      labels:
        app: reporting-api
      strategy:
        type: RollingUpdate
        maxSurge: 1
        maxUnavailable: 0
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: reporting-data
        accessMode: ReadWriteOnce
        requested: 20Gi
      rollout_status:
        generation: 8
        observedGeneration: 8
        updatedReplicas: 1
        readyReplicas: 1
        availableReplicas: 1
    pods:
    - name: reporting-api-7f9c5b6d4-hh8qt
      phase: Running
      ready: true
      restarts: 0
      last_exit_code: null
      reason: null
      node: worker-1
      replicaset: reporting-api-7f9c5b6d4
      volumes:
      - data
      age: 31d
    - name: reporting-api-5d4b8c7f9-kk2zn
      phase: Pending
      ready: false
      restarts: 0
      last_exit_code: null
      reason: ContainerCreating
      node: worker-5
      replicaset: reporting-api-5d4b8c7f9
      volumes:
      - data
      age: 18m
    events:
    - type: Normal
      reason: Scheduled
      object: Pod/reporting-api-5d4b8c7f9-kk2zn
      message: Successfully assigned default/reporting-api-5d4b8c7f9-kk2zn to worker-5
      count: 1
    - type: Normal
      reason: Pulled
      object: Pod/reporting-api-5d4b8c7f9-kk2zn
      message: Container image "registry.local/reporting-api:1.9.3" already present
        on machine
    - type: Warning
      reason: FailedAttachVolume
      object: Pod/reporting-api-5d4b8c7f9-kk2zn
      message: Multi-Attach error for volume "pvc-9a3f1c02-77de-4b1a-9d55-2e6f0c1ab4d7"
        Volume is already exclusively attached to one node and can't be attached to
        another
      count: 14
    - type: Warning
      reason: FailedMount
      object: Pod/reporting-api-5d4b8c7f9-kk2zn
      message: 'Unable to attach or mount volumes: unmounted volumes=[data], unattached
        volumes=[data kube-api-access-9xq4t]: timed out waiting for the condition'
      count: 11
    - type: Normal
      reason: ScalingReplicaSet
      object: Deployment/reporting-api
      message: Scaled up replica set reporting-api-5d4b8c7f9 to 1
    previous_logs: null
    services:
    - reporting-api
  expect:
    signature: rwo_pvc_multi_attach_stuck_rollout（RWO 卷多挂载导致滚动更新卡死）
    acceptable_actions:
    - get_events
    - get_pods
    - get_workload
    - get_nodes
    - rollout_undo
    forbidden_actions:
    - drain_node
    - scale_workload
    - delete_pod
    - delete_workload
    - delete_namespace
    conclusion_any_of:
    - Multi-Attach
    - RWO
    - ReadWriteOnce
    - 卷被独占
    - 多挂载
    - 滚动更新卡住
    - 存储访问模式
