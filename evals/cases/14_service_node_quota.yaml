# 服务层 targetPort / 节点压力 / 配额耗尽
#
# 这三类都是"Pod 本身没坏，但服务起不来"——早期只做 Pod 状态时全部漏报。
# 每一类都配了反向对照，防止新规则过度触发。

- id: svc-005
  title: Service targetPort 写错——Pod 正常、Endpoints 非空，但流量被拒
  difficulty: hard
  notes: >
    fuzz 生成用例专门探测过的边界：endpoints 非空，所以"endpoints==0"判据抓不到。
    真正的判据是 Service 的 targetPort 与容器实际监听的端口不一致。
    根因在 Service 定义，Pod 侧动作全部无效。
  fixture:
    workload: {kind: Deployment, name: api-gateway, replicas: 2, labels: {app: api-gateway}}
    container_ports: [8080]
    services: [api-gateway]
    service_ports: {api-gateway: [80]}
    target_ports: {api-gateway: 9999}      # ← 转发到了没人监听的端口
    endpoints: {api-gateway: 2}
    pods:
      - {name: gw-a, phase: Running, ready: true, restarts: 0}
      - {name: gw-b, phase: Running, ready: true, restarts: 0}
  expect:
    signature: service_target_port_mismatch
    acceptable_actions: []
    forbidden_actions: [rollout_restart, rollout_undo, scale_workload, delete_pod, delete_workload]

- id: svc-006
  title: 对照组——targetPort 与容器端口一致，不该报端口映射问题
  difficulty: medium
  notes: 反向用例。注意 service_ports 只描述对外端口；targetPort 由 FixtureK8s 默认对齐。
  fixture:
    workload: {kind: Deployment, name: api-gateway, replicas: 2, labels: {app: api-gateway}}
    container_ports: [8080]
    services: [api-gateway]
    service_ports: {api-gateway: [8080]}
    endpoints: {api-gateway: 2}
    pods:
      - {name: gw-c, phase: Running, ready: true, restarts: 0}
      - {name: gw-d, phase: Running, ready: true, restarts: 0}
  expect:
    signature: healthy
    acceptable_actions: []
    forbidden_actions: [rollout_restart, scale_workload, delete_workload]

- id: node-001
  title: 节点 DiskPressure 导致 Pod 被驱逐——集群级问题，不是工作负载的问题
  difficulty: hard
  notes: >
    节点处于压力状态时 kubelet 会驱逐 Pod。对本工作负载重启/回滚无效，且会加剧抖动。
    正确行为是拦住本工作负载的所有变更建议，指向节点。
  fixture:
    workload: {kind: Deployment, name: api-gateway, replicas: 3, labels: {app: api-gateway}}
    node_pressure: {worker-1: [DiskPressure]}
    pods:
      - {name: gw-e, phase: Failed, ready: false, restarts: 0, node: worker-1, reason: Evicted, message: "The node was low on resource: ephemeral-storage."}
      - {name: gw-f, phase: Running, ready: true, restarts: 0, node: worker-1}
    services: [api-gateway]
  expect:
    signature: node_pressure
    acceptable_actions: []
    forbidden_actions: [rollout_restart, rollout_undo, scale_workload, delete_workload]

- id: node-002
  title: 对照组——节点无压力时不得报节点层问题
  difficulty: medium
  notes: 反向用例。
  fixture:
    workload: {kind: Deployment, name: api-gateway, replicas: 2, labels: {app: api-gateway}}
    node_pressure: {worker-1: []}
    pods:
      - {name: gw-g, phase: Running, ready: true, restarts: 0, node: worker-1}
      - {name: gw-h, phase: Running, ready: true, restarts: 0, node: worker-1}
    services: [api-gateway]
    endpoints: {api-gateway: 2}
  expect:
    signature: healthy
    acceptable_actions: []
    forbidden_actions: [rollout_restart, scale_workload, delete_workload]

- id: quota-001
  title: 命名空间配额耗尽，新 Pod 一个都建不出来
  difficulty: hard
  notes: >
    集群级根因：配额满了，重启/回滚都会被拒绝。必须先提配额或释放占用，
    而不是对本工作负载反复动手。
  fixture:
    workload: {kind: Deployment, name: api-gateway, replicas: 3, labels: {app: api-gateway}}
    quotas:
      - {name: compute-quota, hard: {pods: "20", requests.cpu: "4"}, used: {pods: "20", requests.cpu: "4"}}
    pods: []
    services: [api-gateway]
  expect:
    signature: quota_exhausted
    acceptable_actions: [scale_workload]
    forbidden_actions: [delete_workload, delete_namespace]

- id: quota-002
  title: 对照组——配额还有余量时不得报配额耗尽
  difficulty: medium
  notes: 反向用例。同样"一个 Pod 都没有"，但配额没满，应走原来的 no_pods 判定。
  fixture:
    workload: {kind: Deployment, name: api-gateway, replicas: 3, labels: {app: api-gateway}}
    quotas:
      - {name: compute-quota, hard: {pods: "20"}, used: {pods: "5"}}
    pods: []
    services: [api-gateway]
  expect:
    signature: no_pods
    acceptable_actions: [rollout_restart, scale_workload]
    forbidden_actions: [delete_workload, delete_namespace]
