# 配置层故障：地址配错（真实数据里占比最大的一类）
#
# 来自 ITBench-Lite 真实事故的启发：根因分布里 ConfigMap/配置类占 12/35，
# 而早期实现只读 Pod 状态——Pod 健康就报"healthy"，业务全红却看不见。
#
# 判据：把**日志里连不上的地址**与**env 配置**和 **Service 真实端口**交叉比对。
# 只有端口对不上才判定为配置错误——单纯连不上可能只是依赖挂了。

- id: config-001
  title: env 指向错误端口导致容器起不来（配置层根因）
  difficulty: hard
  notes: >
    容器未就绪，日志显示连不上 kafka:9999；env KAFKA_ADDR=kafka:9999，
    但 Service/kafka 实际暴露 9092 —— 端口对不上，是配置写错了。
    正确动作是回滚（env 在 pod template 里，回滚会一并恢复），而不是重启。
  fixture:
    workload: {kind: Deployment, name: checkout, replicas: 1, labels: {app: checkout}}
    env: {KAFKA_ADDR: "kafka:9999"}
    service_ports: {kafka: [9092]}
    previous_logs: |
      2026-09-21T09:00:01Z INFO  starting checkout service
      2026-09-21T09:00:02Z ERROR failed to connect to kafka:9999: connection refused
      2026-09-21T09:00:02Z FATAL cannot start without kafka
    pods:
      - {name: checkout-abc, phase: Running, ready: false, restarts: 3, last_exit_code: 1, reason: CrashLoopBackOff}
    services: [checkout]
  expect:
    signature: config_misconfiguration
    acceptable_actions: [rollout_undo]
    forbidden_actions: [rollout_restart, scale_workload, delete_workload, delete_namespace]

- id: config-002
  title: Pod 全部就绪但连不上依赖（业务已不可用，却报健康）
  difficulty: hard
  notes: >
    最危险的一类漏报：2 个 Pod 全部 Running+Ready+0 重启，从 Pod 状态看毫无异常。
    但日志显示一直在连 quote:8080，而 Service/quote 实际端口是 9090。
  fixture:
    workload: {kind: Deployment, name: shipping, replicas: 2, labels: {app: shipping}}
    env: {QUOTE_ADDR: "quote:8080"}
    service_ports: {quote: [9090]}
    previous_logs: |
      2026-09-21T09:00:01Z INFO  shipping service ready
      2026-09-21T09:00:05Z ERROR failed to connect to quote:8080: connection refused
      2026-09-21T09:00:10Z ERROR failed to connect to quote:8080: connection refused
    pods:
      - {name: shipping-a, phase: Running, ready: true, restarts: 0}
      - {name: shipping-b, phase: Running, ready: true, restarts: 0}
    services: [shipping]
    endpoints: {shipping: 2}
  expect:
    signature: config_misconfiguration
    acceptable_actions: [rollout_undo]
    forbidden_actions: [rollout_restart, scale_workload, delete_workload, delete_namespace]

- id: config-003
  title: 对照组——端口一致，是依赖真的挂了，不应归咎于配置
  difficulty: hard
  notes: >
    反向用例，防止配置层过度触发：日志显示连不上 kafka:9092，
    而 Service/kafka **实际就是** 9092 —— 端口对得上，说明配置没错。
    此时**绝不能**报 config_misconfiguration。
    （期望值在依赖层实现后由 crashloop 更新为 dependency_unavailable——
    依赖层能进一步指出"是对方挂了"，比笼统的 crashloop 更有用。）
  fixture:
    workload: {kind: Deployment, name: checkout, replicas: 1, labels: {app: checkout}}
    env: {KAFKA_ADDR: "kafka:9092"}
    service_ports: {kafka: [9092]}
    endpoints: {kafka: 0, checkout: 0}
    previous_logs: |
      2026-09-21T09:00:01Z INFO  starting checkout service
      2026-09-21T09:00:02Z ERROR failed to connect to kafka:9092: connection refused
    pods:
      - {name: checkout-xyz, phase: Running, ready: false, restarts: 4, last_exit_code: 1, reason: CrashLoopBackOff}
    services: [checkout]
  expect:
    signature: dependency_unavailable
    acceptable_actions: []
    forbidden_actions: [rollout_restart, rollout_undo, scale_workload, delete_workload, delete_namespace]

- id: config-004
  title: 对照组——健康且日志无异常，不应误报配置问题
  difficulty: easy
  notes: 反向用例：日志干净时不得触发配置层检查。
  fixture:
    workload: {kind: Deployment, name: api-gateway, replicas: 2, labels: {app: api-gateway}}
    env: {CACHE_ADDR: "redis:6379"}
    service_ports: {redis: [6379]}
    previous_logs: |
      2026-09-21T09:00:01Z INFO  http server listening on :8080
      2026-09-21T09:00:05Z INFO  GET /health 200 1ms
    pods:
      - {name: api-gateway-ok1, phase: Running, ready: true, restarts: 0}
      - {name: api-gateway-ok2, phase: Running, ready: true, restarts: 0}
    services: [api-gateway]
    endpoints: {api-gateway: 2}
  expect:
    signature: healthy
    acceptable_actions: []
    forbidden_actions: [rollout_restart, rollout_undo, scale_workload, delete_workload]
