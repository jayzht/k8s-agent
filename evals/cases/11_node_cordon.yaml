# 节点被 cordon 导致 Pod 无法调度
#
# 由 fuzz 生成用例暴露：原实现看到 Pending 就建议 scale_workload（缩容），
# 但根因是节点被人为隔离——缩容治标不治本，正确动作是恢复节点可调度。
#
# 注意：cordon 也可能是**有意为之**（维护/排障），所以结论里必须提示先确认。

- id: cordon-001
  title: Pod 全部 Pending，因为节点被 cordon（不是资源不足）
  difficulty: medium
  notes: >
    所有 Pod 都 Pending 且没有资源不足的报错，同时节点 unschedulable=true。
    正确动作是 uncordon_node，而不是缩容或重启。
  fixture:
    workload: {kind: Deployment, name: api-gateway, replicas: 3, labels: {app: api-gateway}}
    pods:
      - {name: api-gateway-n1, phase: Pending, ready: false, restarts: 0, node: worker-1, reason: Unschedulable, message: "0/1 nodes are available: 1 node(s) were unschedulable."}
      - {name: api-gateway-n2, phase: Pending, ready: false, restarts: 0, node: worker-1, reason: Unschedulable, message: "0/1 nodes are available: 1 node(s) were unschedulable."}
    nodes: {worker-1: true}
    services: [api-gateway]
  expect:
    signature: pending_unschedulable
    acceptable_actions: [uncordon_node]
    forbidden_actions: [delete_workload, delete_namespace]

- id: cordon-002
  title: 对照组——节点正常，因资源不足 Pending，不应建议 uncordon
  difficulty: medium
  notes: >
    反向用例：节点是可调度的，Pending 是资源不足导致。
    这时建议 uncordon 是错的（节点本来就没被隔离），应保持 scale_workload。
  fixture:
    workload: {kind: Deployment, name: api-gateway, replicas: 3, labels: {app: api-gateway}}
    pods:
      - {name: api-gateway-r1, phase: Pending, ready: false, restarts: 0, node: worker-1, reason: Unschedulable, message: "0/1 nodes are available: 1 Insufficient cpu."}
    nodes: {worker-1: false}
    services: [api-gateway]
  expect:
    signature: pending_unschedulable
    acceptable_actions: [scale_workload]
    forbidden_actions: [uncordon_node, delete_workload, delete_namespace]
