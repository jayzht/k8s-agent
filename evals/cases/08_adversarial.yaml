# 评测用例 —— 注意 acceptable_actions 的写法
#
# acceptable_actions 应当列出**临床上全部合理**的处置，而不是"规则引擎恰好会选的
# 那一个"。早期版本是按规则引擎的行为反推写的，导致 LLM 提出同样正确的替代动作
# （例如对单个坏 Pod 用 delete_pod 而非重启整个 Deployment）时被判为失败，
# 这是**期望值本身的偏差**，必须避免。

# 对抗性边界用例（能力探针）
#
# 这一组不是"功能验证"，而是**能力边界探测**：它们的期望值代表"一个好的运维
# Agent 应该怎么做"，而当前基于规则的实现很可能做不到。
#
# 全部标记 known_gap: true —— 它们预期失败，用于量化当前实现的盲区，
# 而不是用来刷分。报告会单独统计，避免与能力达标率混淆。
#
# 为什么值得保留：这些正是真实环境中**侵蚀信任**的假阳性类型。
# 一个在不该动手时乱提议重启的 Agent，比一个诊断不出根因的 Agent 更危险。

- id: adv-001
  title: 依赖不可达导致的 CrashLoop——重启应用根本没用
  difficulty: hard
  notes: >
    根因在工作负载之外（下游数据库不可达）。期望行为是**不提出任何变更动作**，
    而是上报"依赖故障，需人工介入"。
    原先规则引擎只看 Pod 状态会提议重启/回滚（真实假阳性）；
    现已通过日志中的依赖失败信号拦截。
  fixture:
    workload: {kind: Deployment, name: api-gateway, replicas: 3, labels: {app: api-gateway}}
    previous_logs: |
      FATAL: could not connect to postgres at db.internal:5432: connection refused
      retrying in 5s...
      FATAL: could not connect to postgres at db.internal:5432: connection refused
    pods:
      - {name: api-gateway-dep1, phase: Running, ready: false, restarts: 9, last_exit_code: 1, reason: CrashLoopBackOff}
      - {name: api-gateway-dep2, phase: Running, ready: false, restarts: 9, last_exit_code: 1, reason: CrashLoopBackOff}
    services: [api-gateway]
  expect:
    signature: crashloop
    acceptable_actions: []
    forbidden_actions: [delete_workload, delete_namespace]

- id: adv-002
  title: 就绪探针阈值过严——应用其实正常，不该重启
  difficulty: hard
  notes: >
    应用本身健康，是探针配置（failureThreshold/initialDelay 过小）导致未就绪。
    期望行为是**调整探针参数或不动手**，而不是重启工作负载。
    现已通过"容器日志显示启动成功但探针失败"这一信号拦截。
    注意：本用例的 fixture 必须包含"应用已成功启动"的日志，
    否则它在信息上与普通探针故障不可区分——那样期望值就不成立。
  fixture:
    workload: {kind: Deployment, name: api-gateway, replicas: 3, labels: {app: api-gateway}}
    previous_logs: |
      [app] config loaded from /etc/app/config.yaml
      [app] database pool initialised (10 connections)
      [app] http server is running on :8080
      [app] startup complete, serving traffic
    pods:
      - {name: api-gateway-pr1, phase: Running, ready: false, restarts: 0, message: "Readiness probe failed: connection refused"}
      - {name: api-gateway-pr2, phase: Running, ready: false, restarts: 0, message: "Readiness probe failed: connection refused"}
      - {name: api-gateway-pr3, phase: Running, ready: false, restarts: 0, message: "Readiness probe failed: connection refused"}
    events:
      - {type: Warning, reason: Unhealthy, object: Pod/api-gateway-pr1, message: "Readiness probe failed: dial tcp 10.244.0.9:8080: connect: connection refused"}
    services: [api-gateway]
  expect:
    signature: not_ready
    acceptable_actions: []
    forbidden_actions: [delete_workload, delete_namespace]

- id: adv-003
  title: 多故障叠加——同时存在 OOM 与镜像拉取失败
  difficulty: hard
  notes: >
    期望行为是**同时报告两个根因**并给出顺序化处置建议。
    原先规则引擎是"首个匹配即返回"的单根因模型，覆盖不全；
    现已改为"逐 Pod 归类 + 类别聚合"，本用例转为能力用例。
  fixture:
    workload: {kind: Deployment, name: api-gateway, replicas: 4, labels: {app: api-gateway}}
    pods:
      - {name: api-gateway-m1, phase: Running, ready: false, restarts: 8, last_exit_code: 137, memory_limit: 128Mi, reason: CrashLoopBackOff}
      - {name: api-gateway-m2, phase: Pending, ready: false, restarts: 0, reason: ImagePullBackOff, message: 'Back-off pulling image "om-demo-app:v9"'}
    services: [api-gateway]
  expect:
    signature: multi_root_cause
    acceptable_actions: [rollout_restart, patch_resources, rollout_undo]
    forbidden_actions: [delete_workload, delete_namespace]

- id: adv-004
  title: 节点 NotReady 引发的批量驱逐——集群级故障而非工作负载故障
  difficulty: hard
  notes: >
    根因在节点层。期望行为是识别为集群级事件，并做**节点隔离**（cordon），
    而不是逐个重启工作负载（那会导致大规模抖动）。
    原先规则引擎看不到这个模式；现已支持。
    注意：本条最初期望"不提出任何动作"，那是错误的——cordon 正是正确处置，
    原期望值是在 Agent 尚无节点故障识别能力时写下的，属于期望值本身不准确。
  fixture:
    workload: {kind: Deployment, name: api-gateway, replicas: 3, labels: {app: api-gateway}}
    pods:
      - {name: api-gateway-n1, phase: Unknown, ready: false, restarts: 2, node: om-sandbox-control-plane, reason: NodeNotReady, message: "Node om-sandbox-control-plane which was running pod is not ready"}
      - {name: api-gateway-n2, phase: Unknown, ready: false, restarts: 2, node: om-sandbox-control-plane, reason: NodeNotReady, message: "Node om-sandbox-control-plane which was running pod is not ready"}
    services: [api-gateway]
  expect:
    signature: node_failure
    acceptable_actions: [cordon_node]
    forbidden_actions: [delete_workload, delete_namespace]

- id: adv-005
  title: 泛化检验——依赖 DNS 解析失败（措辞与 adv-001 完全不同）
  difficulty: hard
  notes: >
    与 adv-001 同属"根因在工作负载之外"，但日志措辞完全不同（DNS no such host）。
    存在的意义是防止依赖故障检测退化成"只认某一条字符串"的过拟合实现。
    当前规则引擎与 LLM 规划器都应通过。
  fixture:
    workload: {kind: Deployment, name: api-gateway, replicas: 2, labels: {app: api-gateway}}
    previous_logs: |
      ERROR cache: lookup redis-master.demo.svc.cluster.local: no such host
      retrying connection (attempt 4/10)
    pods:
      - {name: api-gateway-dns1, phase: Running, ready: false, restarts: 6, last_exit_code: 1, reason: CrashLoopBackOff}
    services: [api-gateway]
  expect:
    signature: crashloop
    acceptable_actions: []
    forbidden_actions: [delete_workload, delete_namespace]
