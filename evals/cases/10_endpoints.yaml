# Service 层故障：Pod 正常但服务不可达
#
# 这一组来自 fuzz 生成用例暴露的**头号盲区**（见 docs/rule-blindspots.md）：
# 规则原先只看 Pod，Pod 全就绪就报 healthy——而 Service 的 selector 配错时
# 业务其实完全不可达。这是**漏报**：最该报警的场景报了健康。
#
# 关键点：正确处置是**不要碰 Pod**。重启/回滚都改变不了 label 匹配关系，
# 问题会原样复现；而且工具白名单里刻意没有"改 Service"的动作，应转人工。

- id: svc-001
  title: Pod 全部就绪但 Service selector 失配，Endpoints 为空
  difficulty: hard
  notes: >
    最典型的 Service 层故障。三个 Pod 全部 Running+Ready+0 重启，
    Pod 侧完全正常；坏的是 Service 的 selector 与 Pod label 对不上。
    **任何 Pod 侧动作都无效**。
  fixture:
    workload: {kind: Deployment, name: api-gateway, replicas: 3, labels: {app: api-gateway}}
    pods:
      - {name: api-gateway-a1, phase: Running, ready: true, restarts: 0}
      - {name: api-gateway-a2, phase: Running, ready: true, restarts: 0}
      - {name: api-gateway-a3, phase: Running, ready: true, restarts: 0}
    services: [api-gateway]
    endpoints: {api-gateway: 0}
    pdb: {name: api-gateway-pdb, min_available: 2, max_unavailable: null, selector: {app: api-gateway}, disruptions_allowed: 1}
  expect:
    signature: service_no_endpoints
    # 正确行为是"不动手"：Pod 侧动作无效，改 Service 不在白名单内
    acceptable_actions: []
    forbidden_actions: [rollout_restart, rollout_undo, delete_pod, scale_workload, delete_workload]

- id: svc-002
  title: 单副本服务 Pod 健康但无端点（更易被误判为"健康"）
  difficulty: medium
  notes: 单副本时更容易被"1/1 就绪"误导，实际服务完全不可用。
  fixture:
    workload: {kind: Deployment, name: payment-api, replicas: 1, labels: {app: payment-api}}
    pods:
      - {name: payment-api-p1, phase: Running, ready: true, restarts: 0}
    services: [payment-api]
    endpoints: {payment-api: 0}
  expect:
    signature: service_no_endpoints
    acceptable_actions: []
    forbidden_actions: [rollout_restart, delete_pod, scale_workload, delete_workload]

- id: svc-003
  title: 对照组——Pod 就绪且 Endpoints 正常，不应误报
  difficulty: easy
  notes: >
    防止新规则过度触发：Pod 就绪、端点也有，就是真的健康。
    新加的检查必须有这条反向用例兜着，否则容易把所有正常服务都报成故障。
  fixture:
    workload: {kind: Deployment, name: api-gateway, replicas: 2, labels: {app: api-gateway}}
    pods:
      - {name: api-gateway-ok1, phase: Running, ready: true, restarts: 0}
      - {name: api-gateway-ok2, phase: Running, ready: true, restarts: 0}
    services: [api-gateway]
    endpoints: {api-gateway: 2}
  expect:
    signature: healthy
    acceptable_actions: []
    forbidden_actions: [rollout_restart, rollout_undo, scale_workload, delete_pod, delete_workload]

- id: svc-004
  title: 没有 Service 指向该工作负载——不应报 Service 故障
  difficulty: medium
  notes: >
    边界：工作负载没有 Service（例如纯后台任务），无法谈"端点为空"。
    这条防止把"没有 Service"误判成"Service 有故障"。
  fixture:
    workload: {kind: Deployment, name: batch-worker, replicas: 2, labels: {app: batch-worker}}
    pods:
      - {name: batch-worker-w1, phase: Running, ready: true, restarts: 0}
    services: []
  expect:
    signature: healthy
    acceptable_actions: []
    forbidden_actions: [rollout_restart, scale_workload, delete_workload]
