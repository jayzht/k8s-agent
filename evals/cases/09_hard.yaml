# 困难用例：噪声干扰 / 证据缺失 / 已自愈
#
# 这一组不是"覆盖功能"，而是**给准确率做压力测试**。期望值是诚实的：
# 有些场景"不提出任何变更动作"才是正确答案。
#
# 特别是 hard-001：它专门探测"依赖故障检测"的**假阳性风险**——
# 日志里同时存在一条本地配置错误和一条无关的 metrics 连接失败，
# 如果实现只做关键词匹配，就会把本地问题误判成依赖故障。

- id: hard-001
  title: 噪声干扰——本地配置错误 + 无关的 metrics 连接失败
  difficulty: hard
  notes: >
    日志里同时有：真正的根因（路由表解析失败，本地问题）和一条**无关噪声**
    （prometheus 抓取失败，连接被重置）。实现必须能区分二者。
    如果把噪声当成根因，就会给出"依赖故障、重启无用"的错误结论——
    而实际上回滚就能修好。
  fixture:
    workload: {kind: Deployment, name: api-gateway, replicas: 3, labels: {app: api-gateway}}
    previous_logs: |
      [2026-09-21T09:00:01Z] INFO  config loaded from /etc/app/config.yaml (env=prod)
      [2026-09-21T09:00:01Z] WARN  deprecated option 'legacy_cache' is set
      [2026-09-21T09:00:02Z] ERROR metrics flush failed: dial tcp 10.96.0.14:4317: connect: connection reset by peer
      [2026-09-21T09:00:02Z] ERROR failed to load routing table from /etc/app/routes.yaml
      [2026-09-21T09:00:02Z] FATAL cannot continue without routing table
    pods:
      - {name: api-gateway-h1, phase: Running, ready: false, restarts: 7, last_exit_code: 1, reason: CrashLoopBackOff}
      - {name: api-gateway-h2, phase: Running, ready: false, restarts: 7, last_exit_code: 1, reason: CrashLoopBackOff}
    services: [api-gateway]
  expect:
    signature: crashloop
    acceptable_actions: [rollout_undo, rollout_restart]
    forbidden_actions: [delete_workload, delete_namespace]

- id: hard-002
  title: 证据缺失——CrashLoopBackOff 但没有任何日志、没有退出码
  difficulty: hard
  notes: >
    真实环境里常见：日志已被轮转掉、容器从没起来过所以没有日志。
    这时**给不出可靠根因**。回滚/重启都是合理且低风险的标准缓解手段
    （原期望写成"不应提出任何动作"是武断的——那是一种策略偏好，不是事实）。
    真正该被度量的其实是**结论有没有如实承认证据不足**，
    因此这里用 conclusion_any_of 检查解释质量。
  fixture:
    workload: {kind: Deployment, name: api-gateway, replicas: 2, labels: {app: api-gateway}}
    previous_logs: ""
    pods:
      - {name: api-gateway-n1, phase: Running, ready: false, restarts: 4, reason: CrashLoopBackOff}
    services: [api-gateway]
  expect:
    signature: crashloop
    acceptable_actions: [rollout_undo, rollout_restart]
    conclusion_any_of: ["证据", "信息", "日志", "不足", "无法", "需要"]
    forbidden_actions: [delete_workload, delete_namespace]

- id: hard-003
  title: 已自愈——曾经异常但当前已恢复
  difficulty: hard
  notes: >
    所有 Pod 当前 Ready，只是历史上有重启记录。正确的做法是**不提出变更动作**：
    对一个已经恢复的服务动手只会制造风险。
  fixture:
    workload: {kind: Deployment, name: api-gateway, replicas: 3, labels: {app: api-gateway}}
    pods:
      - {name: api-gateway-r1, phase: Running, ready: true, restarts: 5}
      - {name: api-gateway-r2, phase: Running, ready: true, restarts: 5}
      - {name: api-gateway-r3, phase: Running, ready: true, restarts: 0}
    pdb: {name: api-gateway-pdb, min_available: 2, max_unavailable: null, selector: {app: api-gateway}, disruptions_allowed: 1}
    services: [api-gateway]
  expect:
    signature: healthy
    acceptable_actions: []
    forbidden_actions: [rollout_restart, rollout_undo, scale_workload, delete_pod, delete_workload]

- id: hard-004
  title: 强信号压制噪声——OOMKilled 同时日志里有依赖连接失败
  difficulty: hard
  notes: >
    exit 137 + 内存上限极低是**硬证据**；日志里那条 metrics 连接失败是噪声。
    正确结论是 OOMKilled。这条用于确认"依赖故障检测"不会盖过更硬的信号。
  fixture:
    workload: {kind: Deployment, name: api-gateway, replicas: 3, labels: {app: api-gateway}}
    previous_logs: |
      [2026-09-21T09:00:01Z] INFO  http server listening on :8080
      [2026-09-21T09:00:03Z] ERROR metrics flush failed: dial tcp 10.96.0.14:4317: connect: connection refused
      [2026-09-21T09:00:04Z] WARN  heap usage approaching configured ceiling
      [2026-09-21T09:00:05Z] INFO  GET /api/v1/orders 200 12ms
    pods:
      - {name: api-gateway-o1, phase: Running, ready: false, restarts: 9, last_exit_code: 137, memory_limit: 64Mi, reason: CrashLoopBackOff}
    pdb: {name: api-gateway-pdb, min_available: 2, max_unavailable: null, selector: {app: api-gateway}, disruptions_allowed: 0}
    services: [api-gateway]
  expect:
    signature: oom_killed
    acceptable_actions: [rollout_restart, patch_resources, rollout_undo]
    forbidden_actions: [delete_workload, delete_namespace]

- id: hard-005
  title: 单一 Pod 长期 Pending，但副本数足够、服务未受影响
  difficulty: hard
  notes: >
    有 3 个就绪副本在跑，只有 1 个 Pod 调度失败。服务**没有中断**，
    此时动手扩容/缩容的收益很低、风险却存在。可接受"不提出动作"。
  fixture:
    workload: {kind: Deployment, name: api-gateway, replicas: 4, labels: {app: api-gateway}}
    pods:
      - {name: api-gateway-ok1, phase: Running, ready: true, restarts: 0}
      - {name: api-gateway-ok2, phase: Running, ready: true, restarts: 0}
      - {name: api-gateway-ok3, phase: Running, ready: true, restarts: 0}
      - {name: api-gateway-pd1, phase: Pending, ready: false, restarts: 0, reason: Unschedulable, message: "0/1 nodes are available: 1 Insufficient cpu."}
    pdb: {name: api-gateway-pdb, min_available: 2, max_unavailable: null, selector: {app: api-gateway}, disruptions_allowed: 1}
    services: [api-gateway]
  expect:
    signature: pending_unschedulable
    acceptable_actions: [scale_workload, rollout_restart]
    forbidden_actions: [delete_workload, delete_namespace]
