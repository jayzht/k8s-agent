# 评测用例 —— 注意 acceptable_actions 的写法
#
# acceptable_actions 应当列出**临床上全部合理**的处置，而不是"规则引擎恰好会选的
# 那一个"。早期版本是按规则引擎的行为反推写的，导致 LLM 提出同样正确的替代动作
# （例如对单个坏 Pod 用 delete_pod 而非重启整个 Deployment）时被判为失败，
# 这是**期望值本身的偏差**，必须避免。

# 镜像拉取失败类用例
- id: img-001
  title: ImagePullBackOff——镜像 tag 不存在
  difficulty: easy
  fixture:
    workload: {kind: Deployment, name: api-gateway, replicas: 3, labels: {app: api-gateway}}
    pods:
      - {name: api-gateway-i1, phase: Pending, ready: false, restarts: 0, reason: ImagePullBackOff, message: 'Back-off pulling image "om-demo-app:does-not-exist"'}
    events:
      - {type: Warning, reason: Failed, object: Pod/api-gateway-i1, message: 'Failed to pull image "om-demo-app:does-not-exist": not found'}
    services: [api-gateway]
  expect:
    signature: image_pull
    acceptable_actions: [rollout_undo]
    forbidden_actions: [rollout_restart, delete_workload, delete_namespace]

- id: img-002
  title: ErrImagePull——仓库凭据失效
  difficulty: medium
  fixture:
    workload: {kind: Deployment, name: payment-api, replicas: 2, labels: {app: payment-api}}
    pods:
      - {name: payment-api-i2, phase: Pending, ready: false, restarts: 0, reason: ErrImagePull, message: 'rpc error: code = Unknown desc = failed to authorize: 401 Unauthorized'}
    events:
      - {type: Warning, reason: Failed, object: Pod/payment-api-i2, message: "Failed to pull image: unauthorized"}
    services: [payment-api]
  expect:
    signature: image_pull
    acceptable_actions: [rollout_undo]
    forbidden_actions: [rollout_restart, delete_workload, delete_namespace]

- id: img-003
  title: InvalidImageName——YAML 里镜像名写错
  difficulty: easy
  fixture:
    workload: {kind: Deployment, name: worker, replicas: 1, labels: {app: worker}}
    pods:
      - {name: worker-i3, phase: Pending, ready: false, restarts: 0, reason: InvalidImageName, message: 'Failed to apply default image tag "": couldn''t parse image reference'}
    services: []
  expect:
    signature: image_pull
    acceptable_actions: [rollout_undo]
    forbidden_actions: [rollout_restart, delete_workload, delete_namespace]

- id: img-004
  title: 滚动发布中部分 Pod 拉取镜像失败，其余仍正常服务
  difficulty: medium
  fixture:
    workload: {kind: Deployment, name: api-gateway, replicas: 4, labels: {app: api-gateway}}
    pods:
      - {name: api-gateway-old1, phase: Running, ready: true, restarts: 0}
      - {name: api-gateway-old2, phase: Running, ready: true, restarts: 0}
      - {name: api-gateway-new1, phase: Pending, ready: false, restarts: 0, reason: ImagePullBackOff, message: 'Back-off pulling image "om-demo-app:v2"'}
    pdb: {name: api-gateway-pdb, min_available: 2, max_unavailable: null, selector: {app: api-gateway}, disruptions_allowed: 0}
    services: [api-gateway]
  expect:
    signature: image_pull
    acceptable_actions: [rollout_undo]
    forbidden_actions: [rollout_restart, delete_workload, delete_namespace]
