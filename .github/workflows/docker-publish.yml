# 发布容器镜像到 GHCR。
#
# 这是这个项目"像别的产品那样快速用起来"的最后一环：有了公开镜像，
# 使用者不需要 clone 仓库、不需要装 Python，一条命令就能跑：
#
#   docker run -d --network host \
#     -e DEEPSEEK_API_KEY=sk-... \
#     -v ~/.kube/config:/kubeconfig/config:ro \
#     -v omagent-data:/data \
#     ghcr.io/<你的用户名>/omagent:1.0.0
#
# 打一个 tag 就会自动构建并推送（多架构）：
#   git tag v1.0.0 && git push origin v1.0.0
#
# 也可以在 Actions 页面手动触发（workflow_dispatch）。
name: publish-image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # 推 GHCR 必须要这一行

    steps:
      - uses: actions/checkout@v4

      # arm64 要跨架构构建，需要 QEMU；不加的话 Apple Silicon / 国产 ARM 用户
      # 拉到 amd64 镜像只能靠模拟跑，慢得没法用。
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN 是 Actions 自带的，不需要额外配 secret
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 层缓存：第二次构建几秒钟就好
          cache-from: type=gha
          cache-to: type=gha,mode=max
