<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O&M Agent · 监控台</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="dot" id="cluster-dot" title="集群连接状态"></span>
    <strong>O&amp;M Agent</strong>
    <span class="muted" id="cluster-info">连接中…</span>
  </div>
  <div class="topbar-right">
    <span class="user-chip" id="user-chip" hidden>
      <span class="user-dot" id="user-dot"></span>
      <span id="user-name"></span>
      <span class="user-role muted small" id="user-role"></span>
      <button class="ghost" id="btn-logout" title="退出登录">退出</button>
    </span>
    <label class="ns-picker">
      命名空间
      <select id="ns-select"></select>
    </label>
    <a class="ghost" href="/wall" target="_blank" title="打开集群大屏（适合挂在墙上）">大屏 ↗</a>
    <button class="ghost" id="btn-refresh" title="重新拉取集群状态">刷新</button>
    <button class="ghost" id="btn-audit" title="查看审计记录">审计</button>
    <div class="demo-wrap" id="demo-wrap" hidden>
      <button class="ghost danger" id="btn-demo">制造故障 ▾</button>
      <div class="demo-menu" id="demo-menu" hidden>
        <p class="muted small">模拟「某个同事推了一次坏变更」，只影响演示环境。</p>
        <div class="fault-target">
          <label for="fault-target-select">改哪个？</label>
          <select id="fault-target-select"></select>
        </div>
        <div id="fault-list"></div>
        <div class="demo-out muted small" id="demo-out"></div>
      </div>
    </div>
  </div>
</header>

<main class="layout">

  <!-- ── 左：监控台 ─────────────────────────────────────── -->
  <aside class="console">
    <div class="console-head">
      <h2>监控台</h2>
      <span class="muted small" id="console-summary"></span>
    </div>
    <div class="console-body" id="console-body">
      <p class="muted placeholder"><span class="spin"></span> 正在读取集群状态…</p>
    </div>
  </aside>

  <!-- ── 右：对话 ───────────────────────────────────────── -->
  <section class="chat">
    <div class="chat-head">
      <label class="session-picker" for="session-select">
        <span class="muted small">会话</span>
        <select id="session-select" title="切换历史会话"></select>
      </label>
      <button class="ghost" id="btn-new-session" title="开一个新的排查会话">＋ 新会话</button>
      <button class="ghost" id="btn-del-session" title="删除当前会话">删除</button>
      <span class="muted small session-meta" id="session-meta"></span>
    </div>
    <div class="messages" id="messages">
      <div class="empty" id="empty">
        <h2>左边看到哪儿不对，就在这儿问。</h2>
        <p class="muted">
          我会自己去读 Pod 状态、事件、日志、配置，把原因查清楚再给建议。<br>
          <b>只读的查询我自己跑，不用你点。</b>
          需要改动集群的操作，我会先给你一张确认卡片。
        </p>
        <div class="suggest" id="suggest"></div>
      </div>
    </div>
    <form class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="描述你看到的问题，例如：api-gateway 一直在重启"></textarea>
      <button type="submit" id="send">发送</button>
    </form>
    <div class="composer-hint muted small" id="composer-hint"></div>
  </section>
</main>

<!-- ── 登录遮罩 ─────────────────────────────────────────── -->
<div class="login-mask" id="login-mask" hidden>
  <form class="login-card" id="login-form">
    <h1>O&amp;M Agent</h1>
    <p class="muted small">
      这个界面能批准对集群的写操作，所以要先确认你是谁。<br>
      你的名字会写进审计记录——<b>审批人即责任人</b>。
    </p>
    <label class="login-field">
      <span>用户名</span>
      <input id="login-user" name="username" autocomplete="username">
    </label>
    <label class="login-field">
      <span>密码</span>
      <input id="login-pass" name="password" type="password" autocomplete="current-password">
    </label>
    <button type="submit" id="login-btn">登录</button>
    <p class="login-err" id="login-err"></p>
  </form>
</div>

<!-- ── 审计抽屉 ─────────────────────────────────────────── -->
<div class="drawer-mask" id="drawer-mask" hidden></div>
<aside class="drawer" id="drawer" hidden>
  <div class="drawer-head">
    <h2>审计记录</h2>
    <button class="ghost" id="drawer-close">关闭</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<script src="/static/app.js"></script>
</body>
</html>
