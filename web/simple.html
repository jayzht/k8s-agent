<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>运维 Agent · 演示</title>
<link rel="stylesheet" href="/static/simple.css">
</head>
<body>

<header>
  <h1>运维 Agent 演示</h1>
  <p class="sub">跟着往下点就行，每一步只做一件事</p>
</header>

<main>

  <!-- ── 第 1 步 ─────────────────────────────────────── -->
  <section class="step" id="s1">
    <div class="step-head"><span class="num">1</span>
      <div><h2>先制造一个故障</h2>
      <p class="muted">模拟"某个同事推了一次坏代码"</p></div>
    </div>
    <div class="choices" id="fault-buttons">
      <button class="choice" data-fault="oom">
        <b>💥 内存不够用</b><span>程序吃内存超过了上限，被系统杀掉</span></button>
      <button class="choice" data-fault="crash">
        <b>🔁 程序起来就崩</b><span>启动时报错退出，然后不停重启</span></button>
      <button class="choice" data-fault="image">
        <b>📦 程序包找不到</b><span>要运行的程序包拉不下来</span></button>
      <button class="choice" data-fault="pending">
        <b>⏳ 没机器能跑它</b><span>要求的机器条件没人满足</span></button>
    </div>
    <p class="muted small">只会影响演示环境，不会碰真实业务</p>
  </section>

  <!-- ── 第 2 步 ─────────────────────────────────────── -->
  <section class="step" id="s2" hidden>
    <div class="step-head"><span class="num">2</span>
      <div><h2>让 Agent 去看看</h2>
      <p class="muted" id="s2-sub">它会去读程序状态、报错信息、运行日志，然后告诉你出了什么事</p></div>
    </div>
    <div id="wait-hint" class="warn" hidden>
      ⏳ 故障刚注入，需要 30 秒左右才会显现。
      <button class="link" id="wait-ok">不等了，直接看 →</button>
    </div>
    <button class="primary" id="btn-diagnose">开始诊断</button>
  </section>

  <!-- ── 第 3 步 ─────────────────────────────────────── -->
  <section class="step" id="s3" hidden>
    <div class="step-head"><span class="num">3</span>
      <div><h2>它查到了什么</h2></div>
    </div>
    <div class="verdict" id="verdict"></div>
    <div class="conclusion" id="conclusion"></div>
    <button class="link" id="toggle-evidence">▸ 它看到了哪些证据</button>
    <div class="evidence" id="evidence" hidden></div>
  </section>

  <!-- ── 第 4 步 ─────────────────────────────────────── -->
  <section class="step" id="s4" hidden>
    <div class="step-head"><span class="num">4</span>
      <div><h2>要不要修？</h2>
      <p class="muted">它给了建议，但<b>决定权在你</b>——你不会被它替你做主</p></div>
    </div>
    <div id="plan"></div>
    <div class="actions" id="decision">
      <button class="primary" id="btn-yes">✅ 就这么修</button>
      <button class="ghost" id="btn-no">先不动</button>
    </div>
  </section>

  <!-- ── 结果 ────────────────────────────────────────── -->
  <section class="step" id="s5" hidden>
    <div id="outcome"></div>
    <button class="ghost" id="btn-again">↻ 再试一次</button>
  </section>

  <p class="foot">
    想看完整版（含审计日志、知识沉淀、策略配置）→
    <a href="/pro">打开专业视图</a>
  </p>

</main>

<div id="toast" class="toast" hidden></div>
<script src="/static/simple.js"></script>
</body>
</html>
