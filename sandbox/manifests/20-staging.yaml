---
apiVersion: v1
kind: ConfigMap
metadata:
  name: feature-flags-config
  namespace: staging
data:
  FLAGS_ENDPOINT: "http://feature-flags.staging.svc.cluster.local:8080"
  REFRESH_INTERVAL: "30s"

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: staging-quota
  namespace: staging
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: staging-limits
  namespace: staging
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 128Mi
      defaultRequest:
        cpu: 50m
        memory: 32Mi
      max:
        cpu: "1"
        memory: 1Gi
