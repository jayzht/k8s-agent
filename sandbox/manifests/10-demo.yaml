apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: demo
  labels:
    app: web-frontend
    app.kubernetes.io/name: web-frontend
    app.kubernetes.io/part-of: demo-shop
  annotations:
    omagent.io/note: "用户入口，挂着 Ingress"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: web-frontend
        app.kubernetes.io/name: web-frontend
    spec:
      containers:
        - name: app
          image: om-demo-app:1
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: MODE
              value: "normal"
            - name: SERVICE_NAME
              value: "web-frontend"
            - name: APP_ENV
              value: "demo"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: web-frontend
  namespace: demo
  labels:
    app: web-frontend
spec:
  selector:
    app: web-frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080

