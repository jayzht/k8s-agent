kind: StatefulSet
metadata:
  name: postgres-primary
  namespace: core
  labels:
    app: postgres-primary
    app.kubernetes.io/name: postgres-primary
    app.kubernetes.io/part-of: demo-shop
spec:
  serviceName: postgres-primary
  replicas: 1
  selector:
    matchLabels:
      app: postgres-primary
  template:
    metadata:
      labels:
        app: postgres-primary
        app.kubernetes.io/name: postgres-primary
    spec:
      containers:
        - name: app
          image: om-demo-app:1
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: MODE
              value: "normal"
            - name: SERVICE_NAME
              value: "postgres-primary"
            - name: APP_ENV
              value: "core"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
  volumeClaimTemplates:
