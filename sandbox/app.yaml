# 沙箱演示应用。
#
# 刻意设计成覆盖全部演示剧本：
#   api-gateway   —— 3 副本 + PDB(minAvailable=2)，用于正例：健康检查、滚动重启、影响面分析
#   session-store —— 单副本 StatefulSet + PVC，用于演示"单点有状态服务"确认强度升级
#   billing-core  —— 带 omagent.io/protected 标签，用于演示保护标签熔断
#
# 所有工作负载都用同一个本地镜像 om-demo-app:1（imagePullPolicy: Never），
# 不依赖任何外部镜像仓库。
apiVersion: v1
kind: Namespace
metadata:
  name: demo
  labels:
    omagent.io/managed: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: demo
  labels:
    app: api-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: app
          image: om-demo-app:1
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: MODE
              value: normal
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: demo
spec:
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: demo
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: api-gateway
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: session-store
  namespace: demo
  labels:
    app: session-store
spec:
  serviceName: session-store
  replicas: 1
  selector:
    matchLabels:
      app: session-store
  template:
    metadata:
      labels:
        app: session-store
    spec:
      containers:
        - name: app
          image: om-demo-app:1
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: MODE
              value: normal
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: session-store
  namespace: demo
spec:
  clusterIP: None
  selector:
    app: session-store
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-core
  namespace: demo
  labels:
    app: billing-core
    # 保护标签：Agent 对它的任何 T1 及以上操作都会被熔断拦截
    omagent.io/protected: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing-core
  template:
    metadata:
      labels:
        app: billing-core
    spec:
      containers:
        - name: app
          image: om-demo-app:1
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: MODE
              value: normal
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: billing-core
  namespace: demo
spec:
  selector:
    app: billing-core
  ports:
    - port: 80
      targetPort: 8080
