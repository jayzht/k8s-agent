# O&M Agent 安全策略配置
#
# 这是产品的核心资产之一：Tier 分级与熔断规则**必须配置化**，不能写死在代码里。
# 理由：上线后一定会调整，且不同业务线的风险容忍度不同（PRD 5.1）。
#
# 修改本文件后需重启 Agent 或调用 reload（Demo 阶段重启即可）。

version: 1

# ---------------------------------------------------------------------------
# 命名空间允许列表
# 不在列表内的命名空间，任何 T1 及以上操作一律硬拒绝。
# 生产环境建议在此处**不要**直接放行生产命名空间，而是走单独的审批通道。
# ---------------------------------------------------------------------------
allowed_namespaces:
  - demo
  - staging

# ---------------------------------------------------------------------------
# 节点白名单（cordon / drain 等节点级动作）
#
# 为什么单独一份：节点是集群级资源，没有 namespace。若沿用命名空间白名单，
# 空字符串永远不匹配，会导致**所有节点动作被无声地全部拦死**（这个 bug 由
# 评测用例 adv-004 发现）。生产环境请显式列出可操作的节点。
# ---------------------------------------------------------------------------
allowed_nodes:
  - om-sandbox-control-plane

# 带这些标签的节点禁止任何节点级动作
protected_node_labels:
  "node-role.kubernetes.io/control-plane": "false"

# 只读操作额外允许的命名空间（诊断用，不涉及写操作）
readonly_namespaces:
  - kube-system
  - default
  - demo
  - staging

# ---------------------------------------------------------------------------
# 保护标签：带这些标签的资源禁止 T1 及以上操作，无论谁批准
# ---------------------------------------------------------------------------
protected_labels:
  "omagent.io/protected": "true"
  "app.kubernetes.io/tier": "critical"

# ---------------------------------------------------------------------------
# 熔断规则（PRD 5.5）
# ---------------------------------------------------------------------------
circuit_breakers:
  # 单次操作可影响的 Pod/资源数上限，超过则硬拒绝
  max_impacted_objects: 10

  # 同一工作负载在 N 秒内不允许重复变更，防止抖动性连续重启
  per_workload_cooldown_seconds: 300

  # 副本数为 1 的有状态服务：T1 操作自动升级为 T2 强确认
  escalate_singleton_stateful: true

  # 挂载 PVC 的工作负载：T1 升级为 T2
  escalate_pvc_backed: true

  # 强制 dry-run：执行前必须在服务端干跑通过，否则不生成方案
  require_dry_run: true

  # 冻结窗口：此时间段内强制降级为只读（格式 HH:MM-HH:MM）
  # 大促/封网期在此配置。留空表示不启用。
  freeze_windows: []

# ---------------------------------------------------------------------------
# Tier 3 绝对禁止动作清单
# 即使有人工批准也不执行，只能引导用户走人工变更流程。
# 这份清单是"安全机制本身即产品亮点"的载体（PRD 第 9 节剧本 2）。
# ---------------------------------------------------------------------------
forbidden_actions:
  - id: delete_namespace
    desc: 删除命名空间
    hint: 如需清理，请先逐个下线工作负载并确认无流量，走标准变更流程。
  - id: delete_workload
    desc: 删除 Deployment / StatefulSet / DaemonSet
    hint: 如需下线服务，请先缩容到 0 并观察 N 天，再走标准变更流程删除。
  - id: delete_pvc
    desc: 删除 PersistentVolumeClaim
    hint: 数据不可恢复，必须走数据保护流程并由数据责任人审批。
  - id: secret_access
    desc: 读取或修改 Secret
    hint: Agent 永远不接触 Secret。需要凭据请从密钥管理系统获取。
  - id: modify_rbac
    desc: 修改 Role / ClusterRole / RoleBinding / ServiceAccount
    hint: 权限变更必须走安全审批流程，Agent 无权自我提权。
  - id: cross_namespace
    desc: 跨命名空间批量操作
    hint: 请拆分为单个命名空间的操作分别审批。
  - id: node_operation
    desc: 节点级破坏性操作（drain 之外）
    hint: 节点操作请联系平台团队。
  - id: crd_write
    desc: 写入 CRD / Operator 自定义资源
    hint: 自定义资源语义未知，Agent 不做写操作。

# ---------------------------------------------------------------------------
# 受管动作白名单：只有这里登记的动作才可能被执行
# mutating=false 的工具自动放行；mutating=true 的工具永远需要人工批准。
# ---------------------------------------------------------------------------
actions:
  # --- T0 只读 ---
  - name: get_pods
    tier: T0
    mutating: false
  - name: describe_workload
    tier: T0
    mutating: false
  - name: get_events
    tier: T0
    mutating: false
  - name: get_logs
    tier: T0
    mutating: false
  - name: get_top
    tier: T0
    mutating: false
  - name: get_pdb
    tier: T0
    mutating: false
  - name: get_hpa
    tier: T0
    mutating: false
  - name: get_workload
    tier: T0
    mutating: false
  - name: get_nodes
    tier: T0
    mutating: false
  - name: get_endpoints
    tier: T0
    mutating: false
  - name: get_services
    tier: T0
    mutating: false
  - name: get_configmap
    tier: T0
    mutating: false

  # --- T1 低危写 ---
  - name: rollout_restart
    tier: T1
    mutating: true
    rollback: "无自动回滚；重启为幂等操作，服务会在滚动过程中保持可用"
    rollback_eta: "不适用"
  - name: rollout_undo
    tier: T1
    mutating: true
    rollback: "rollout undo --to-revision=<当前版本>"
    rollback_eta: "< 60s"
  - name: scale_workload
    tier: T1
    mutating: true
    rollback: "scale 回原副本数"
    rollback_eta: "< 30s"
  - name: delete_pod
    tier: T1
    mutating: true
    rollback: "Pod 由控制器自动重建，无需回滚"
    rollback_eta: "< 60s"
  - name: cordon_node
    tier: T1
    mutating: true
    rollback: "uncordon 节点"
    rollback_eta: "< 10s"
  - name: uncordon_node
    tier: T1
    mutating: true
    rollback: "重新 cordon 节点"
    rollback_eta: "< 10s"

  # --- T2 中危写 ---
  - name: drain_node
    tier: T2
    mutating: true
    rollback: "uncordon 节点并等待 Pod 重新调度"
    rollback_eta: "1-5min"
  - name: patch_resources
    tier: T2
    mutating: true
    rollback: "patch 回原 requests/limits"
    rollback_eta: "< 60s"
  - name: patch_hpa
    tier: T2
    mutating: true
    rollback: "patch 回原 min/max"
    rollback_eta: "< 30s"
  - name: rollback_configmap
    tier: T2
    mutating: true
    # K8s 原生不保留 ConfigMap 历史，版本由本项目的 ConfigMapHistory 记录
    rollback: "再次 rollback_configmap 切回当前版本"
    rollback_eta: "< 30s"

  # --- T3 禁止：刻意登记在册 ---
  # 为什么明知禁止还要登记？纵深防御。即使规划器（或 LLM 幻觉）产出了这些动作名，
  # 门禁也能识别并硬拒绝，而不是因为"未登记"报一个普通错误。
  # 这些动作永远不会被执行——apply_mutation 中没有对应实现。
  - name: delete_workload
    tier: T3
    mutating: true
  - name: delete_namespace
    tier: T3
    mutating: true
  - name: delete_pvc
    tier: T3
    mutating: true
  - name: modify_rbac
    tier: T3
    mutating: true
  - name: read_secret
    tier: T3
    mutating: true
